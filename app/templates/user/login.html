{% extends "base.html" %}

{% block title %}
User Login
{% endblock %}


{% block content %}

<h1>User Login</h1>

<form method="POST">
<input
    type="hidden"
    name="csrf_token"
    value="{{ csrf_token() }}"
>
    <label>
        Email
    </label>

    <input
        type="email"
        name="email"
        required
    >


    <label>
        Password
    </label>

    <input
        type="password"
        name="password"
        required
    >


    <button type="submit">
        Login
    </button>

</form>


<p>
    Don't have an account?

    <a href="{{ url_for('user.register') }}">
        Register
    </a>
</p>

{% endblock %}
